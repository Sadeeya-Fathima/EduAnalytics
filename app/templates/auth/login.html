
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | EduAnalytics</title>
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='branding/eduanalytics-emblem.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="login-page">
    <div class="login-shell">
        <header class="login-topbar">
            <div class="login-brand">
                <img src="{{ url_for('static', filename='branding/eduanalytics-emblem.png') }}"
                     alt="" aria-hidden="true">
                <span>Edu<strong>Analytics</strong></span>
            </div>
        </header>

        <main class="login-content">
            <section class="login-card" aria-labelledby="login-title">
                <img class="login-logo"
                     src="{{ url_for('static', filename='branding/eduanalytics-logo-transparent.png') }}"
                     alt="EduAnalytics Student Analytics">
                <!-- <h1 id="login-title">Sign in to <span>Edu<strong>Analytics</strong></span></h1> -->

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="login-alert" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="login-field">
                        <label for="userid">User ID</label>
                        <input type="text" id="userid" name="userid"
                               autocomplete="username" required>
                    </div>

                    <div class="login-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="login-button">Sign in</button>
                </form>
            </section>
        </main>

        <footer class="login-footer">EduAnalytics · VTU BCD586 Mini Project </footer>
    </div>

</body>
</html>
