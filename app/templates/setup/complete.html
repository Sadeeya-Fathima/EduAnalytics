
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup Complete | EduAnalytics</title>
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='branding/eduanalytics-emblem.png') }}">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <section class="card shadow-sm border-0 rounded-4 p-4 text-center"
                 style="width: 100%; max-width: 480px;">
            <div class="card-body">
                <img src="{{ url_for('static', filename='branding/eduanalytics-emblem.png') }}"
                     class="img-fluid d-block mx-auto mb-3"
                     style="max-height: 120px; object-fit: contain;"
                     alt="EduAnalytics emblem">
                <h1 class="h3 mb-3">EduAnalytics is already set up</h1>
                <p class="text-secondary mb-4">
                    Initial setup is unavailable because an Administrator account
                    already exists.
                </p>
                <a class="btn btn-primary w-100"
                   href="{{ url_for('auth.login') }}">
                    Go to sign in
                </a>
            </div>
        </section>
    </main>
</body>
</html>
